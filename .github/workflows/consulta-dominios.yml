# Temporal: consulta si los dominios están libres (se borra después de usarlo).
name: Consulta dominios
on:
  push:
    branches: [consulta-dominios]
permissions:
  contents: write
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq whois >/dev/null
      - name: Consultar
        run: |
          set +e
          exec > >(tee resultados-dominios.txt) 2>&1
          nombres="artigas canelones cerrolargo colonia durazno flores florida lavalleja maldonado montevideo paysandu rionegro rivera rocha salto sanjose soriano tacuarembo treintaytres melo coloniadelsacramento trinidad minas sanjosedemayo mercedes fraybentos"
          echo "=== muestra whois .com.uy ==="
          whois -h whois.nic.org.uy taxifraybentos.com.uy | head -25
          echo "---"
          whois -h whois.nic.org.uy zzqqxx123libre.com.uy | head -15
          echo "---"
          whois -h whois.nic.org.uy salto.uy | head -15
          echo "=== resultados ==="
          for d in $nombres; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "https://rdap.verisign.com/com/v1/domain/$d.com")
            [ "$c" = "404" ] && com=LIBRE || { [ "$c" = "200" ] && com=OCUPADO || com="?$c"; }
            res="RES $d .com=$com"
            for tld in com.uy uy; do
              out=$(whois -h whois.nic.org.uy "$d.$tld" 2>&1 || true)
              if echo "$out" | grep -qiE "no match|not found|no encontrado|no existe|No Data Found|No entries"; then r=LIBRE
              elif echo "$out" | grep -qiE "domain name|dominio|registrant|status|creat"; then r=OCUPADO
              else r="?"; fi
              res="$res .$tld=$r"
              sleep 1
            done
            echo "$res"
          done
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add resultados-dominios.txt && git commit -m "Resultados consulta de dominios" && git push
