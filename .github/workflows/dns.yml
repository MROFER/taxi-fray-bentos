name: dns-check
on: push
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://www.taxifraybentos.com.uy
          for i in $(seq 1 30); do curl -s $S/ | grep -q 'name="consentimiento"' && break; sleep 10; done
          echo "== casillas en la home:"; curl -s $S/ | grep -c 'name="declaracion"' || true
          echo "== POST sin casillas"; curl -s -w " %{http_code}\n" --data-urlencode "titular=PRUEBA Claude (borrar)" --data-urlencode "telefono=099 000 000" --data-urlencode "permiso=JTX 0000" $S/api/alta.php
          echo "== POST con casillas"; curl -s -w " %{http_code}\n" --data-urlencode "titular=PRUEBA Claude 2 (borrar)" --data-urlencode "telefono=099 000 000" --data-urlencode "permiso=JTX 0000" -d consentimiento=si -d declaracion=si $S/api/alta.php
