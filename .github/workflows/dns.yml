name: dns-check
on: push
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.taxifraybentos.com.uy/ https://taxifraybentos.com.uy/ https://www.taxifraybentos.com.uy/robots.txt https://www.taxifraybentos.com.uy/api/alta.php; do
            echo "== $u"; curl -s -o /tmp/b -w "%{http_code} %{redirect_url}\n" --max-time 20 "$u"; head -c 300 /tmp/b | tr '\n' ' '; echo; grep -o '<title>[^<]*' /tmp/b || true; done
