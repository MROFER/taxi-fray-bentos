# Publica la landing en GitHub Pages en cada push a main: https://mrofer.github.io/taxi-fray-bentos/
# Arma el sitio y lo sube a la rama gh-pages (Pages sirve esa rama).
# Con dominio propio, cambiar SITE_URL por el dominio y BASE_PATH por "/".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://mrofer.github.io
      BASE_PATH: /taxi-fray-bentos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Subir dist/ a gh-pages
        run: |
          cd dist
          rm -f _headers
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
